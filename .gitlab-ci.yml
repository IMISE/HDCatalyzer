workflow:
    rules:
    - if: $CI_COMMIT_TAG
        when: never
    - if: $CI_COMMIT_BRANCH == 'main'

stages:
    - build
    - compose_up
    - log
    - clean

build_job:
    stage: build
    script:
        - docker compose build webapp

compose_up_job:
    stage: compose_up
    script:
        - docker compose up -d

clean:
    stage: clean
    script:
        - docker system prune -f
    